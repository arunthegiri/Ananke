# Server
server.port=8080

# TimescaleDB (PostgreSQL-compatible)
spring.datasource.url=jdbc:postgresql://localhost:5432/stockdb
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Alpaca API
alpaca.api.base-url=https://data.alpaca.markets
alpaca.api.key=${ALPACA_API_KEY}
alpaca.api.secret=${ALPACA_API_SECRET}

# Fetch interval in milliseconds (default: 60000 = 1 minute)
alpaca.fetch.interval-ms=${FETCH_INTERVAL_MS:60000}

# Async executor for backfill jobs
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=10
spring.task.execution.thread-name-prefix=backfill-

# Alpaca Paper Trading API (separate from data API)
alpaca.trading.base-url=https://paper-api.alpaca.markets
alpaca.trading.key=${ALPACA_TRADING_KEY:}
alpaca.trading.secret=${ALPACA_TRADING_SECRET:}

# Copilot LLM provider — bring-your-own-key + local-model support.
# provider = openai_compatible (OpenAI, Kimi/Moonshot, Groq, Together, DeepSeek,
#            OpenRouter, or any local server exposing an OpenAI-compatible
#            /chat/completions endpoint: Ollama, LM Studio, vLLM, llama.cpp
#            server, text-generation-webui, koboldcpp, ...)
#          | anthropic
# Single global config for now (see LlmProviderConfig) — no per-user keys yet.
llm.provider=${LLM_PROVIDER:openai_compatible}

# openai_compatible provider (KimiClient). Falls back to the legacy kimi.*
# properties below so an existing .env keeps working untouched.
llm.api-key=${LLM_API_KEY:${KIMI_API_KEY:}}
llm.base-url=${LLM_BASE_URL:${KIMI_BASE_URL:https://api.moonshot.ai/v1}}
llm.model=${LLM_MODEL:${KIMI_MODEL:kimi-k2-0905-preview}}

# Legacy names — still read as fallbacks above, kept only so nothing already
# relying on them breaks. Prefer LLM_* / llm.* going forward.
kimi.api-key=${KIMI_API_KEY:}
kimi.base-url=${KIMI_BASE_URL:https://api.moonshot.ai/v1}
kimi.model=${KIMI_MODEL:kimi-k2-0905-preview}

# anthropic provider (AnthropicClient) — used when llm.provider=anthropic.
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.base-url=${ANTHROPIC_BASE_URL:https://api.anthropic.com}
anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-4-5}

# Copilot: Python executor running alongside JupyterLab (executor/executor.py)
jupyter.executor.url=${JUPYTER_EXECUTOR_URL:http://jupyter:5000}

# Logging
logging.level.com.stocktracker=INFO
logging.level.org.springframework.web=WARN

# Copilot settings saved from the UI (provider, model, API keys). Docker sets
# ANANKE_SETTINGS_FILE to a named volume so they survive container rebuilds.
ananke.settings.file=${ANANKE_SETTINGS_FILE:./data/llm-settings.json}

# ── Ananke Packs (Dev-notes/Ananke Packs Build Doc.md) ─────────────────────
# Master key for encrypted credentials (base64, 32 bytes). Unset = generated key file on the data volume.
ananke.secret-key=${ANANKE_SECRET_KEY:}
ananke.secret-key-file=${ANANKE_SECRET_KEY_FILE:./data/secret.key}
ananke.packs.vllm-version=${ANANKE_VLLM_VERSION:0.11.0}
ananke.packs.health-timeout-minutes=${ANANKE_PACKS_HEALTH_TIMEOUT_MINUTES:30}
ananke.packs.deploy-timeout-minutes=${ANANKE_PACKS_DEPLOY_TIMEOUT_MINUTES:90}
# ── Agent skills (Packs build doc §9) ─────────────────────────────────────────
# The vetted bundle ships in the jar (classpath:skills/, verified at startup). Packs whose
# licence forbids redistribution are installed here by scripts/skills/vendor-skills.mjs install.
ananke.skills.fetch-dir=${ANANKE_SKILLS_FETCH_DIR:./data/skills}
# Optional: load a whole bundle (manifest.json + files) from this directory instead of the jar.
ananke.skills.bundle-dir=${ANANKE_SKILLS_BUNDLE_DIR:}
# Which skill packs the user switched off in Settings.
ananke.skills.settings-file=${ANANKE_SKILLS_SETTINGS_FILE:./data/skills-settings.json}
# ── Cloud compute (Packs build doc §7) ─────────────────────────────────────────
# Tests/emulators only: send every AWS call to this endpoint (e.g. moto). Unset = real AWS.
ananke.cloud.aws.endpoint=${ANANKE_AWS_ENDPOINT:}
ananke.cloud.aws.pricing-endpoint=${ANANKE_AWS_PRICING_ENDPOINT:}
# Public SSM parameter for the Deep Learning Base GPU AMI (Ubuntu 22.04); override only for emulators.
ananke.cloud.aws.dlami-parameter=${ANANKE_AWS_DLAMI_PARAMETER:/aws/service/deeplearning/ami/x86_64/base-oss-nvidia-driver-gpu-ubuntu-22.04/latest/ami-id}
# Provisioning waits: boot (running + public IP) and the host key appearing in the console.
ananke.cloud.aws.boot-timeout-minutes=${ANANKE_AWS_BOOT_TIMEOUT_MINUTES:10}
ananke.cloud.aws.host-key-timeout-minutes=${ANANKE_AWS_HOST_KEY_TIMEOUT_MINUTES:10}
# Where the backend learns its public IP (the SSH source the VM's security group allows).
ananke.cloud.egress-ip-url=${ANANKE_EGRESS_IP_URL:https://checkip.amazonaws.com}
# Idle auto-stop sweep cadence (ms).
ananke.cloud.idle-sweep-ms=${ANANKE_CLOUD_IDLE_SWEEP_MS:300000}
